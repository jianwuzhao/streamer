name: Release plugin
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - name: Check version tag
        run: node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Tag must match package version")'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:worker
      - run: pnpm build
      - name: Create and verify package
        run: |
          mkdir -p artifacts/release
          npm pack --ignore-scripts --pack-destination artifacts/release
          node scripts/verify-release-package.mjs artifacts/release/*.tgz
          cd artifacts/release
          shasum -a 256 *.tgz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --title "DaFeiYu $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
